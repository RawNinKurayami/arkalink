<style>
:root{
  --abyss:#060607; --vellum:#f2e9d8; --vellum-2:#e9d6ae; --ink:#f1ece0; --ink-soft:#a69a86;
  --gold:#f0a441; --gold-bright:#ffd394; --seal:#e23131; --foam:#a69a86; --line:rgba(240,164,65,.22);
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; color:var(--vellum);
  font-family:'Inter',system-ui,sans-serif; font-size:16px; line-height:1.55;
  background:radial-gradient(120% 80% at 50% -10%, #0c0f18 0%, #060607 55%, #060607 100%) fixed;
}
a{color:inherit;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px clamp(16px,4vw,40px); border-bottom:1px solid rgba(240,164,65,.22);}
.brand{display:flex; align-items:center; gap:9px; text-decoration:none;}
.brand .anc{color:var(--gold); font-size:20px;}
.brand .nm{font-family:'Inter',sans-serif; letter-spacing:.16em; text-transform:uppercase; font-size:12px; color:var(--foam);}
.wrap{max-width:1180px; margin:0 auto; padding:clamp(20px,4vw,40px) clamp(16px,4vw,36px) 70px;}
.hero{text-align:center; margin-bottom:18px;}
.hero .kick{font-family:'Inter',sans-serif; letter-spacing:.28em; text-transform:uppercase; font-size:11px; color:var(--gold);}
.hero h1{font-family:'Cormorant Garamond',Georgia,serif; font-weight:900; font-size:clamp(26px,5.5vw,44px); color:var(--vellum); margin:.12em 0 0; text-shadow:0 2px 16px rgba(0,0,0,.4);}

.stepper{display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:18px 0 22px;}
.stepper button{display:flex; align-items:center; gap:7px; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.04em; color:var(--foam); background:rgba(242,233,216,.05); border:1px solid rgba(240,164,65,.3); border-radius:999px; padding:7px 12px; cursor:pointer; transition:.15s;}
.stepper button .n{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:rgba(240,164,65,.25); color:var(--vellum); font-size:11px;}
.stepper button:hover{border-color:var(--gold);}
.stepper button.active{background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#1b1206; border-color:var(--gold);}
.stepper button.active .n{background:#1b1206; color:var(--gold-bright);}
.stepper button.done .n{background:var(--gold); color:#1b1206;}

.panel{background:linear-gradient(168deg, rgba(242,233,216,.035), rgba(242,233,216,.015)); color:var(--ink); border:1px solid var(--line); border-radius:9px; box-shadow:0 16px 44px rgba(0,0,0,.45); padding:clamp(20px,4vw,30px);}
.kicker{font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold);}
.panel h2{font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:clamp(22px,4vw,30px); color:#f2e9d8; margin:.15em 0 .1em;}
.explain{background:rgba(226,49,49,.06); border-left:4px solid var(--gold); border-radius:4px; padding:12px 16px; margin:14px 0 18px; color:var(--ink-soft); font-size:1.02rem;}
.explain b{color:var(--ink);}
label.fld{display:block; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 5px;}
input[type=text], textarea, select{width:100%; font-family:'Inter',sans-serif; font-size:1.1rem; color:var(--ink); background:rgba(242,233,216,.06); border:1px solid rgba(240,164,65,.3); border-radius:5px; padding:10px 13px;}
input[type=text]:focus, textarea:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}
textarea{min-height:80px; resize:vertical;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){ .row2{grid-template-columns:1fr;} }

.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-top:6px;}
.card{background:rgba(242,233,216,.06); border:1px solid var(--line); border-radius:6px; padding:12px 13px; cursor:pointer; transition:.12s;}
.card:hover{border-color:var(--gold);}
.card.sel{border-color:var(--seal); box-shadow:inset 0 0 0 1.5px var(--seal); background:rgba(242,233,216,.12);}
.card .t{font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:1.02rem; color:#f2e9d8;}
.card .d{font-size:.92rem; color:var(--ink-soft); margin-top:3px;}
.infobox{background:rgba(240,164,65,.12); border:1px solid rgba(240,164,65,.4); border-radius:5px; padding:11px 14px; margin-top:14px; font-size:1rem; color:var(--ink);}
.infobox.red{background:rgba(226,49,49,.08); border-color:rgba(226,49,49,.35);}

.attrgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.attrrow{display:flex; align-items:center; justify-content:space-between; background:rgba(242,233,216,.06); border:1px solid var(--line); border-radius:6px; padding:11px 14px;}
.attrrow.locked{background:rgba(242,233,216,.05);}
.attrrow .name{font-weight:600;} .attrrow .sd{font-size:.82rem; color:var(--ink-soft);}
.attrrow .die{font-family:'Inter',sans-serif; font-size:1.05rem; color:#ffd394;}

.counter{font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.06em; color:var(--ink-soft); margin:10px 0;}
.skillrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed rgba(226,49,49,.18);}
.skillrow.role{background:rgba(240,164,65,.12); border-radius:5px; padding:9px 12px; border-bottom:none;}
.skillrow .sn{font-weight:600;} .skillrow .sd{font-size:.85rem; color:var(--ink-soft);}
.pick{display:flex; gap:5px; flex:none;}
.pick button{font-family:'Inter',sans-serif; font-size:11px; border:1px solid var(--line); background:rgba(242,233,216,.06); color:var(--ink-soft); padding:6px 11px; border-radius:5px; cursor:pointer;}
.pick button.on{background:var(--seal); color:#fff; border-color:var(--seal);}

.portrait{width:120px; height:120px; border-radius:8px; border:2px dashed rgba(240,164,65,.3); background:rgba(242,233,216,.06); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); cursor:pointer; overflow:hidden; font-size:.85rem; text-align:center; padding:6px;}
.portrait img{width:100%; height:100%; object-fit:cover;}

.sumgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; margin-top:14px;}
@media(max-width:560px){ .sumgrid{grid-template-columns:1fr;} }
.sumrow{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dotted rgba(226,49,49,.2);}
.sumrow .k{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
.sumrow .v{font-weight:600; text-align:right; color:#f2e9d8;}

.nav{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:22px;}
.btn{font-family:'Inter',sans-serif; letter-spacing:.1em; text-transform:uppercase; font-size:12px; border:none; border-radius:999px; padding:13px 26px; cursor:pointer; transition:transform .15s; text-decoration:none; display:inline-block;}
.btn:hover{transform:translateY(-1px);}
.btn.gold{color:#1b1206; background:linear-gradient(180deg,var(--gold-bright),var(--gold));}
.btn.ghost{color:var(--vellum); background:transparent; border:1px solid rgba(240,164,65,.5);}
.btn.big{font-size:14px; padding:15px 34px;}
.btn:disabled{opacity:.4; cursor:default; transform:none;}

.done-card{text-align:center;}
.done-card .seal{font-size:46px; color:var(--gold);}
.done-card h2{margin-top:6px;}
.done-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px;}
/* ===== character creation UI ===== */
.clay{display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; align-items:start;}
.preview{position:sticky; top:14px; border:1px solid var(--line); border-radius:14px; background:rgba(242,233,216,.035); padding:14px;}
.pv-port{width:100%; aspect-ratio:4/5; border-radius:10px; border:2px solid rgba(240,164,65,.4); background:radial-gradient(circle at 50% 30%,rgba(240,164,65,.12),rgba(10,8,12,.9)); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.9rem; text-align:center; cursor:pointer; overflow:hidden; position:relative;}
.pv-port img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.pv-name{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24px; letter-spacing:.04em; text-transform:uppercase; line-height:1; margin-top:12px;}
.pv-amb{font-style:italic; color:var(--gold-bright); font-size:14px; margin-top:3px;}
.pv-k{font-family:'Inter',sans-serif; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin:12px 0 5px;}
.pv-attrs{display:grid; grid-template-columns:repeat(4,1fr); gap:4px;}
.pv-attr{text-align:center;} .pv-attr .an{font-family:'Inter',sans-serif; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;}
.pv-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:5px;}
.pv-stat{border:1px solid var(--line); border-radius:8px; padding:6px 4px; text-align:center;}
.pv-stat .k{font-family:'Inter',sans-serif; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
.pv-stat .v{font-family:'Inter',sans-serif; font-weight:700; font-size:15px; color:#ffd394;}
.pv-list{font-size:.9rem; line-height:1.45;} .pv-list b{color:#ffd394; font-family:'Inter',sans-serif; font-size:.8rem;}
.pv-empty{color:var(--ink-soft); font-style:italic; font-size:.88rem;}
.gh-pills{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.pill{font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.05em; border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--ink-soft); background:rgba(242,233,216,.05); display:inline-flex; align-items:center; gap:4px;}
.pill.gold{border-color:var(--gold); color:#ffd394; background:rgba(240,164,65,.1);}
.card{display:flex; gap:10px; align-items:flex-start;}
.card .ci{flex:none; display:flex; color:#ffd394;}
.card .cb{min-width:0;}
.card.sel{border-color:var(--gold); box-shadow:0 0 0 1.5px var(--gold), 0 0 16px rgba(240,164,65,.3); background:rgba(240,164,65,.1);}
.card.big{align-items:center;}
.cards.three{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.attrpick{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:14px;}
.attrcard{border:1px solid var(--line); border-radius:10px; padding:12px 10px; text-align:center; background:rgba(242,233,216,.05); cursor:pointer; transition:.12s;}
.attrcard:hover{border-color:var(--gold);}
.attrcard.locked{cursor:default; background:rgba(240,164,65,.08); border-color:rgba(240,164,65,.5);}
.attrcard.sel{border-color:var(--gold); box-shadow:0 0 14px rgba(240,164,65,.3);}
.attrcard .an{font-weight:700; margin-top:6px;} .attrcard .as{font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
.togglecard{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; margin-top:10px; background:rgba(242,233,216,.05);}
.togglecard.on{border-color:var(--gold); background:rgba(240,164,65,.1);}
.togglecard .tg{width:44px; height:24px; border-radius:999px; background:rgba(242,233,216,.15); position:relative; flex:none;}
.togglecard .tg::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#a69a86; transition:.15s;}
.togglecard.on .tg{background:var(--gold);} .togglecard.on .tg::after{left:23px; background:#1b1206;}
.rolecard .ci svg{width:34px; height:34px;}
/* mobile: l'anteprima non resta appiccicata e diventa una scheda compatta (va DOPO le regole base) */
@media(max-width:900px){
  .clay{grid-template-columns:1fr;}
  .preview{position:static; display:grid; grid-template-columns:96px minmax(0,1fr); gap:4px 14px; align-items:start; padding:12px;}
  .pv-port{grid-row:1 / span 3; width:96px; font-size:.7rem;}
  .pv-name{margin-top:0; font-size:20px;}
  .pv-amb{font-size:13px;}
  .preview .gh-pills{margin-top:4px;}
  .preview .pv-k, .preview .pv-attrs, .preview .pv-stats, .preview .pv-list, .preview .pv-empty{grid-column:1 / -1;}
  .preview .pv-more{display:none;}
}

/* Emblemi illustrati */
.icimg.emblem{object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55));}
.gh-pills .pill .icimg.emblem{vertical-align:middle;margin:-5px 2px -4px -4px;}
</style>
</head>

  ];
  var g=el("div",{class:"sumgrid"});
  rows.forEach(function(rw){g.appendChild(el("div",{class:"sumrow",html:'<span class="k">'+rw[0]+'</span><span class="v">'+esc(rw[1])+'</span>'}));});
  p.appendChild(g);
  p.appendChild(el("div",{class:"infobox",html:"Le <b>Tecniche personali</b> si creano nella <b>Gestione del Pirata</b>, dopo il salvataggio."}));

  var save=el("button",{class:"btn gold big",style:"margin-top:22px;width:100%;",text:"⚓ Salva nella tua lista"});
  save.onclick=saveToList;
  p.appendChild(save);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function saveToList(){
  if(!D.nome||!D.nome.trim()){alert("Dai un nome al tuo pirata prima di salvare.");goto(0);return;}
  if(!D.race){alert("Scegli una razza prima di salvare.");goto(1);return;}
  var ct=readCT();var id=newId();ct.chars[id]=D;ct.order.push(id);ct.activeId=id;if(!writeCT(ct))return;
  showDone(id);
}
function showDone(id){
  $("#stepper").style.display="none";$("#nav").style.display="none";var pv=$("#preview");if(pv)pv.style.display="none";document.querySelector(".clay").style.gridTemplateColumns="1fr";
  var p=$("#panel");p.className="panel done-card";p.innerHTML="";
  p.appendChild(el("div",{class:"seal",text:"⚓"}));
  p.appendChild(el("h2",{text:"«"+(D.nome||"Pirata")+"» è nella tua lista!"}));
  p.appendChild(el("div",{style:"color:var(--ink-soft);margin-top:4px;",text:"Salvato nel cloud. Lo ritrovi nel tuo profilo e puoi continuare a svilupparlo nella gestione."}));
  var acts=el("div",{class:"done-actions"});
  acts.appendChild(el("a",{class:"btn gold",href:"/gestisci-pirata/?c="+encodeURIComponent(id),text:"Gestisci questo pirata"}));
  acts.appendChild(el("a",{class:"btn ghost",href:"/profilo/",text:"Vai al mio profilo"}));
  p.appendChild(acts);
  window.scrollTo({top:0,behavior:"smooth"});
}

$("#prev").onclick=function(){goto(step-1);};
$("#next").onclick=function(){goto(step+1);};
buildStepper();goto(0);
})();
</script>
</body>
</html>
