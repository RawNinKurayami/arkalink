<style>
:root{--ink:#f1ece0;--ink-soft:#a69a86;--red:#e23131;--red-br:#ff5240;--gold:#f0a441;--gold-2:#ffd394;--paper:#15121a;--paper-2:#1a1622;--line:rgba(240,164,65,.22);--sea:#3d6a8f;--shadow:rgba(0,0,0,.40);--ok:#7fc796;--warn:#e0b84e;--bad:#e23131;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;color:#f2e9d8;font-size:18px;line-height:1.5;background:radial-gradient(120% 80% at 50% -10%, #0c0f18 0%, #060607 55%, #060607 100%) fixed;min-height:100vh;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.wrap{max-width:1440px;margin:0 auto;padding:18px 16px 80px;}
header.top{text-align:center;position:relative;padding:6px 0 2px;}
header.top .wheel{font-size:34px;color:var(--gold);line-height:1;}
header.top h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:900;font-size:clamp(28px,6vw,48px);color:#f2e9d8;margin:0;text-shadow:0 2px 16px rgba(0,0,0,.45);}
header.top .sub{font-family:'Inter',sans-serif;font-weight:400;letter-spacing:.24em;text-transform:uppercase;font-size:11px;color:#a69a86;margin-top:4px;}
.toolbar{display:none;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 4px;}
.toolbar.gactions{display:flex;}.toolbar.gactions .btn{flex:1 1 45%;padding:11px 10px;font-size:13px;}
.btn{font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;border:1px solid var(--red);background:var(--red);color:#fff;padding:8px 13px;border-radius:2px;cursor:pointer;transition:.15s;}
.btn:hover{background:var(--red-br);}.btn:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px;}
.btn.gold{border-color:var(--gold);background:var(--gold);}.btn.gold:hover{background:var(--gold-2);}
.btn.ghost{background:transparent;color:var(--gold-2);border-color:rgba(240,164,65,.5);}.btn.ghost:hover{background:rgba(240,164,65,.12);}
.btn.sm{font-size:11px;padding:5px 9px;}
.saved{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.1em;color:#a69a86;align-self:center;}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0 16px;border-bottom:2px solid var(--gold);padding-bottom:0;}
.tab{font-family:'Inter',sans-serif;font-weight:400;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(240,164,65,.35);border-bottom:none;background:rgba(242,233,216,.06);color:#a69a86;padding:9px 14px;border-radius:6px 6px 0 0;cursor:pointer;margin-bottom:-2px;}
.tab[aria-selected="true"]{background:linear-gradient(168deg,var(--paper),var(--paper-2));color:#ffd394;border-color:var(--gold);border-bottom:2px solid var(--paper-2);}
.tab:focus-visible{outline:2px solid var(--gold-2);}
section.panel{display:none;}
section.panel.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media(prefers-reduced-motion:reduce){section.panel.active{animation:none}}
/* cards */
.card{background:linear-gradient(168deg,var(--paper),var(--paper-2));border:1px solid var(--line);box-shadow:0 16px 40px var(--shadow);border-radius:8px;padding:16px 18px;margin-bottom:16px;color:var(--ink);}
.card h2{font-family:'Inter',sans-serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;align-items:center;gap:7px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
label.fld{display:block;}
label.fld .lab{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px;display:block;}
input.txt,select.txt,textarea.txt{width:100%;font-family:'Inter',system-ui,sans-serif;font-size:15px;color:var(--ink);background:rgba(242,233,216,.07);border:1px solid var(--line);border-radius:8px;padding:7px 9px;}
input.txt:focus,select.txt:focus,textarea.txt:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 2px rgba(140,28,19,.15);background:rgba(242,233,216,.12);}
textarea.txt{resize:vertical;min-height:60px;line-height:1.45;}
/* stat dice steppers */
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(242,233,216,.06);border:1px solid var(--line);border-radius:3px;padding:9px 11px;}
.stat .info{flex:1;}
.stat .name{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;color:#ffd394;text-transform:uppercase;letter-spacing:.05em;}
.stat .desc{font-size:12.5px;color:var(--ink-soft);}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:26px;height:26px;border:1px solid var(--gold);background:rgba(242,233,216,.1);color:#ffd394;font-weight:700;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;}
.stepper button:hover{background:var(--gold-2);color:#fff;}
.die{font-family:'Inter',sans-serif;font-weight:900;font-size:17px;color:#fff;background:radial-gradient(circle at 35% 30%,#a83227,#6e1410);min-width:42px;text-align:center;padding:5px 4px;border-radius:5px;border:1px solid var(--gold-2);box-shadow:0 2px 4px var(--shadow);}
.derived{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);margin-top:3px;}
.derived b{color:#ffd394;}
/* PS gauge */
.gauge{margin-top:4px;}
.gauge .track{height:22px;background:rgba(242,233,216,.1);border:1px solid rgba(240,164,65,.25);border-radius:11px;overflow:hidden;position:relative;}
.gauge .fill{height:100%;transition:width .25s,background .25s;border-radius:11px 0 0 11px;}
.gauge .pslabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;color:#f2e9d8;text-shadow:0 1px 2px rgba(0,0,0,.7);}
.cond{display:inline-block;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;padding:3px 10px;border-radius:11px;color:#fff;margin-top:6px;}
.psctrl{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
.psctrl input{width:64px;}
/* result box */
.result{margin-top:10px;background:rgba(240,164,65,.07);border:1px dashed var(--gold);border-radius:3px;padding:8px 11px;min-height:20px;font-size:14.5px;}
.result .roll{margin:3px 0;}
.result .roll .tot{font-family:'Inter',sans-serif;font-weight:900;color:#ffd394;}
.tag{display:inline-block;font-family:'Inter',sans-serif;font-weight:700;font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;}
.man-btns{display:flex;flex-wrap:wrap;gap:8px;}
.man-btns .btn{flex:0 0 auto;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.muted{color:var(--ink-soft);font-size:13px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(242,233,216,.06);border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer;}
.chip.broken{background:#fbe3e0;border-color:var(--red);color:var(--red);text-decoration:line-through;}
.mod{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid var(--line);background:rgba(242,233,216,.06);border-radius:3px;padding:8px 11px;margin-bottom:7px;}
.mod .mname{font-family:'Inter',sans-serif;font-weight:700;color:#ffd394;font-size:13px;}
.mod .meff{font-size:13px;color:var(--ink);}
.mod .x{border:none;background:none;color:var(--red);cursor:pointer;font-size:15px;}
.slotbar{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
.slotbar b{color:#ffd394;font-size:16px;}
.crewrow{display:grid;grid-template-columns:1.1fr 1.4fr 0.9fr;gap:8px;align-items:center;margin-bottom:7px;}
@media(max-width:640px){.crewrow{grid-template-columns:1fr;}}
.crewrow .ruolo{font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;color:#ffd394;}
.crewrow .att{font-size:11px;color:var(--ink-soft);}
.note-foot{text-align:center;font-family:'Inter',sans-serif;font-size:12px;color:#a69a86;letter-spacing:.1em;margin-top:14px;}
.help{font-size:13.5px;color:var(--ink-soft);background:rgba(240,164,65,.07);border-left:4px solid var(--gold);border-radius:2px;padding:8px 11px;margin-bottom:12px;}
@media print{.toolbar,.tabs,.shipsbar,.man-btns,.psctrl,.stepper button,.btn,#glc-bar,#glc-overlay,.glc-bar,.glc-overlay{display:none!important;}section.panel{display:block!important;}body{background:#fff!important;color:#2b1d12;}}
.shipsbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 0;}
.shipsbar .sb-label{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;}
.shipsbar .sb-sel{width:auto;min-width:150px;max-width:250px;padding:6px 10px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:rgba(242,233,216,.07);border:1px solid var(--line);border-radius:8px;}
.shipsbar .sb-link{font-size:12px;color:var(--gold-2);text-decoration:none;border-bottom:1px solid transparent;opacity:.9;}
.shipsbar .sb-link:hover{border-bottom-color:currentColor;}

/* ===== character UI della nave ===== */
:root{--ink-soft:#a69a86;--gold-soft:#ffd394;}
.gtop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0 12px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.gt-l{min-width:0;}.gt-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.gh-name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase;line-height:1;}
.gh-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.pill{font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink-soft);background:rgba(242,233,216,.05);}
.pill.cond{font-weight:700;letter-spacing:.1em;}
.gh-bounty{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;}
.g3{display:grid;grid-template-columns:320px minmax(0,1fr) 360px;gap:18px;align-items:start;}
@media(max-width:1180px){.g3{grid-template-columns:320px minmax(0,1fr);}.rpanel{grid-column:1 / -1;}}
@media(max-width:820px){.g3{grid-template-columns:1fr;}.rpanel{grid-column:auto;}}
.lpanel,.rpanel{border:1px solid var(--line);border-radius:14px;background:rgba(242,233,216,.035);padding:14px;}
.lbar{display:grid;grid-template-columns:1fr;gap:6px;margin:2px 0 6px;}
.lbar-k{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
.lbar-t{height:12px;border-radius:999px;background:rgba(242,233,216,.1);border:1px solid rgba(240,164,65,.2);overflow:hidden;}
.lbar-f{height:100%;transition:width .3s;box-shadow:0 0 8px rgba(255,90,60,.5);}
.lbar-v{display:flex;align-items:center;gap:6px;}.lbar-v input.num{width:64px;padding:4px;font-size:14px;text-align:center;}
.vsep{color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:13px;}
.condline{font-size:12px;color:var(--ink-soft);margin:4px 0 12px;}
.lsec{margin-top:10px;}.lsec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px;}.lsec-h h3{margin:0;font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.05em;}
.lpanel .prow{grid-template-columns:1fr;padding:8px 0;}
.pgname{font-weight:700;font-size:15px;}.pnext{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--ink-soft);line-height:1.3;}.pnext b{color:#ffd394;}
.prl{display:flex;align-items:center;gap:10px;min-width:0;}.prl .step2{margin-left:auto;}
.step2{display:inline-flex;align-items:center;gap:4px;}.step2 button{width:24px;height:24px;border:1px solid var(--line);background:rgba(242,233,216,.1);border-radius:50%;cursor:pointer;font-weight:700;color:#ffd394;font-size:14px;line-height:1;}
.stage{position:relative;min-height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,rgba(61,106,143,.25),transparent 60%),linear-gradient(180deg,#0e0b13,#0a1220);padding:14px;display:flex;flex-direction:column;gap:10px;}
.stage.ship::before{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(180deg,rgba(61,106,143,.10) 0 2px,transparent 2px 14px);mask-image:linear-gradient(180deg,transparent,rgba(0,0,0,.6));-webkit-mask-image:linear-gradient(180deg,transparent,rgba(0,0,0,.6));pointer-events:none;}
.stage>*{position:relative;}
.stagenote{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--ink-soft);margin:2px 0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}.stagenote b{color:#ffd394;}.stagenote svg{color:#ffd394;flex:none;}
.slots-h{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:6px 0 2px;}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.slot{display:flex;gap:8px;align-items:center;border:1px solid rgba(240,164,65,.3);border-radius:10px;padding:8px 10px;background:rgba(14,11,19,.78);min-width:0;}
.slot.click{cursor:pointer;transition:.15s;}.slot.click:hover{border-color:var(--gold);box-shadow:0 0 10px rgba(240,164,65,.3);}
.slot.add{border-style:dashed;color:var(--ink-soft);cursor:pointer;}.slot.add:hover{color:#ffd394;border-color:var(--gold-2);}
.slot.empty{opacity:.75;border-style:dashed;}
.slot-i{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#ffd394;}
.slot-b{min-width:0;}.slot-n{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-m{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gc-em{display:inline-flex;color:#ffd394;}
.gcards.one{grid-template-columns:1fr;}
.gcard .gc-m b,.gcard .gc-d b{color:#ffd394;}
.gcard .gc-d{display:block;-webkit-line-clamp:unset;line-height:1.4;}
.rpanel .gtabs{margin-bottom:12px;}.rpanel .gtab{padding:8px 10px;font-size:11.5px;}
.matgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.mattile{border:1px solid var(--line);border-radius:10px;padding:8px 8px 6px;text-align:center;background:rgba(242,233,216,.04);}
.mattile.zero{opacity:.6;}
.matq{font-family:'Inter',sans-serif;font-weight:800;font-size:20px;color:#ffd394;}
.matn{font-size:11.5px;line-height:1.2;min-height:28px;margin:2px 0 5px;}
.matb{display:flex;justify-content:center;gap:4px;}
.diepick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
.diebtn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:rgba(242,233,216,.05);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.diebtn.on{border-color:var(--gold);background:rgba(240,164,65,.15);box-shadow:0 0 10px rgba(240,164,65,.35);}
.lealta{font-family:'Inter',sans-serif;font-weight:800;font-size:22px;color:#ffd394;width:42px;text-align:center;}
.sub{font-size:13px;color:var(--ink-soft);}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.iconbtn{border:none;background:transparent;color:var(--red);cursor:pointer;font-size:13px;padding:2px 6px;font-family:'Inter',sans-serif;}
.gactions{display:flex;flex-wrap:wrap;gap:8px;}
/* topbar di ritorno alla home */
.glc-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid rgba(240,164,65,.16);}
.glc-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.glc-anc{color:var(--gold);font-size:17px;}
.glc-bnm{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#f2e9d8;}
.glc-home{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:#a69a86;text-decoration:none;}
.glc-home:hover{color:#ffd394;}
</style>

<script>
"use strict";
const KEY="glc_nave_v1";
const DICE_SHIP=["d4","d6","d8","d10","d12"];
const DICE_ATTR=["—","d4","d6","d8","d10","d12","d20"];
const PS_BY_DIE={d4:20,d6:30,d8:40,d10:50,d12:60};
const SLOT_BY_DIE={d4:1,d6:2,d8:3,d10:5,d12:7};
const STATIONS=[
 {key:"capitano",ruolo:"Capitano",att:"Spirito",use:"bonus a un alleato"},
 {key:"timoniere",ruolo:"Timoniere",att:"Astuzia",use:"Vele · Navigazione"},
 {key:"cannoniere",ruolo:"Cannoniere",att:"Tecnica",use:"Artiglieria"},
 {key:"vedetta",ruolo:"Vedetta",att:"Astuzia",use:"anti-sorpresa"},
 {key:"ingegnere",ruolo:"Ingegnere",att:"Astuzia",use:"Riparazioni"},
 {key:"combattente",ruolo:"Combattente di bordo",att:"Forza/Tecnica",use:"abbordaggio"},
];
const CATALOG=[
 {nome:"Cannoni gemelli",slot:1,eff:"Una cannonata extra per scena."},
 {nome:"Sperone d'acciaio",slot:1,eff:"Speronamento: +1 gradino di danno."},
